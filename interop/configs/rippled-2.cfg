[server]
port_rpc_admin_local
port_peer

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
tiny

[node_db]
type=NuDB
path=/var/lib/rippled/db/nudb
advisory_delete=0
earliest_seq=1

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[ips_fixed]
172.30.0.10:51235
172.30.0.11:51235
172.30.0.20:51235
172.30.0.21:51235

[validators_file]
validators.txt

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

# Verbose manifest + UNL acceptance traces so confluence-style 3-node
# diagnostics can pinpoint where a peer's manifest is rejected / not
# applied to the active trusted set (the `validator_list.count: 1`
# symptom we hit when only the local self-key activates).
[log_level]
warning
Manifest=trace
ValidatorList=trace
Overlay=debug

[validation_seed]
shqEDAXNxM8Y94qj4Hq2EocLqZEKz

[network_id]
99

[ledger_history]
full

[consensus]
minimum_duration_ms=200

# The default profile uses the full five-validator UNL and its 80% quorum.
# A lower value is available only for diagnostic runs; it must be explicit
# so a passing low-quorum run cannot be mistaken for validator evidence.
[validation_quorum]
4

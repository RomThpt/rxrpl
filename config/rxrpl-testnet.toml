# rxrpl testnet (altnet) node configuration template
#
# Connects to rippletest.net and uses the testnet UNL.
# Start with: rxrpl run --config config/rxrpl-testnet.toml --network

[server]
bind = "127.0.0.1:5005"
admin_ips = ["127.0.0.1"]

[peer]
port = 51235
max_peers = 21
seeds = [
    "s.altnet.rippletest.net:51235",
]
fixed_peers = []
tls_enabled = true

[database]
path = "/var/lib/rxrpl/testnet"
backend = "rocksdb"
online_delete = 2000

[validators]
# This template follows the official XRP Testnet validator list. Keep the
# local signer disabled until a separate validator seed has been provisioned.
enabled = false
trusted = []
validator_list_sites = [
    "https://vl.altnet.rippletest.net",
]
validator_list_keys = [
    "ED264807102805220DA0F312E71FC2C69E1552C9C5790F6C25E3729DEB573D5860",
]
require_trusted_validators = true

[network]
# Altnet network ID.
network_id = 1
